# 자료실의 구글 드라이브 폴더 파일 목록을 6시간마다 새로 읽어 data/links.json 에 반영한다. 키·비밀번호는 쓰지 않는다.
name: 드라이브 목록 갱신

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 폴더 파일 목록 읽기
        run: node scripts/sync-drive.mjs

      - name: 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/links.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "드라이브 폴더 목록 갱신"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
