# 이슈로 링크를 추가/삭제하면 data/links.json 을 갱신하고 이슈를 닫는다.
# 저장소 주인(hdlee73)이 연 이슈만 처리하므로 다른 사람은 링크를 바꿀 수 없다.
name: 링크 저장소 갱신

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  manage:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (contains(github.event.issue.labels.*.name, 'link') ||
       contains(github.event.issue.labels.*.name, 'link-remove') ||
       startsWith(github.event.issue.title, '[링크'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 링크 처리
        id: links
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MODE: ${{ (contains(github.event.issue.labels.*.name, 'link-remove') || startsWith(github.event.issue.title, '[링크 삭제]')) && 'remove' || 'add' }}
        run: node scripts/manage-links.mjs "$MODE"

      - name: 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/links.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "링크 저장소 갱신 (#${{ github.event.issue.number }})"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done

      - name: 결과 댓글 후 이슈 닫기
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.links.outputs.report }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `${process.env.REPORT}\n\n홈페이지에는 1~2분 안에 반영됩니다.`,
            });
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
