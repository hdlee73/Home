# 공개 저장소와 최신 릴리스 정보를 모아 data/apps.json 을 갱신한다.
# 30분마다(실제로는 GitHub 사정으로 더 늦을 수 있음), 그리고 Actions 탭에서 수동으로 실행할 수 있다.
name: 앱 목록 갱신

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/apps-config.json
      - scripts/update-apps.mjs

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 앱 정보 수집
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: node scripts/update-apps.mjs

      - name: 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apps.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "앱 목록 자동 갱신"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done
